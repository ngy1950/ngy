<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${ym.year + '년 ' + ym.monthValue + '월 주문현황'}">주문현황</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #f5f2ee; font-size: 18px; color: #2c2724; }

        /* 상단 바 */
        .top-bar {
            background: #5c3d1e;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* 월 이동 */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 10px;
            background: white;
            border-bottom: 1px solid #ede8e0;
        }
        .month-nav a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f0e9df;
            color: #5c3d1e;
            font-size: 1.4rem;
            font-weight: 900;
            text-decoration: none;
        }
        .month-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #2c2724;
        }

        /* 달력 */
        .calendar-wrap { background: white; padding: 0 8px 12px; }
        .cal-dow-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            padding: 6px 0 4px;
        }
        .cal-dow {
            font-size: 0.8rem;
            font-weight: 700;
            color: #999;
        }
        .cal-dow:first-child { color: #e05555; }
        .cal-dow:last-child  { color: #5588e0; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .cal-cell {
            min-height: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: default;
            position: relative;
        }
        .cal-cell.empty { background: transparent; }
        .cal-cell.has-order {
            background: #8b5a2b;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(0,0,0,0.1);
        }
        .cal-cell.has-order:active { background: #7a4e26; }
        .cal-cell.is-today {
            outline: 3px solid #e8a020;
            outline-offset: -3px;
        }
        .cal-day-num {
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
        }
        .cal-cell.has-order .cal-day-num { color: white; }
        .cal-cell:not(.has-order) .cal-day-num { color: #2c2724; }
        .cal-cell.sun:not(.has-order) .cal-day-num { color: #e05555; }
        .cal-cell.sat:not(.has-order) .cal-day-num { color: #5588e0; }
        .order-dot {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.9);
            font-weight: 700;
            margin-top: 2px;
        }

        /* 범례 */
        .legend {
            display: flex;
            gap: 16px;
            padding: 8px 16px 12px;
            background: white;
            font-size: 0.85rem;
            color: #777;
            border-bottom: 1px solid #ede8e0;
        }
        .legend-box {
            display: inline-block;
            width: 20px; height: 20px;
            border-radius: 6px;
            vertical-align: middle;
            margin-right: 5px;
        }

        /* 주문 섹션 */
        .orders-section { padding: 16px 12px 40px; }
        .date-heading {
            font-size: 1.1rem;
            font-weight: 800;
            color: #5c3d1e;
            margin: 20px 0 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #e0d5c8;
            scroll-margin-top: 80px;
        }
        .order-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            margin-bottom: 14px;
            padding: 16px;
            scroll-margin-top: 80px;
        }
        .order-card.today-card { border: 2px solid #e8a020; }
        .recipient-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .recipient-name { font-size: 22px; font-weight: 800; }
        .recipient-phone { font-size: 18px; color: #555; }
        .info-line {
            font-size: 16px;
            color: #444;
            margin-top: 5px;
            line-height: 1.6;
            word-break: keep-all;
        }
        .info-line strong { color: #5c3d1e; }
        .menu-box {
            background: #faf7f3;
            border-left: 4px solid #c8a87a;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            margin-top: 10px;
            font-size: 16px;
            white-space: pre-wrap;
            word-break: keep-all;
            line-height: 1.7;
        }
        .status-row { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .badge-paid   { background: #d1f0e0; color: #198754; font-weight: 700; padding: 6px 16px; border-radius: 20px; font-size: 16px; }
        .badge-unpaid { background: #fde8e8; color: #dc3545; font-weight: 700; padding: 6px 16px; border-radius: 20px; font-size: 16px; }
        .tracking-chip { background: #f0e9df; color: #5c3d1e; font-size: 15px; padding: 5px 12px; border-radius: 20px; font-weight: 600; }

        .empty-msg { text-align: center; padding: 48px 16px; color: #aaa; font-size: 1.05rem; line-height: 2; }
    </style>
</head>
<body>

<div class="top-bar">🗓 대원 주문현황</div>

<!-- 월 이동 -->
<div class="month-nav">
    <a th:href="@{/schedule/{t}(t=${token}, year=${prevYm.year}, month=${prevYm.monthValue})}">&lsaquo;</a>
    <span class="month-title" th:text="${ym.year + '년 ' + ym.monthValue + '월'}"></span>
    <a th:href="@{/schedule/{t}(t=${token}, year=${nextYm.year}, month=${nextYm.monthValue})}">&rsaquo;</a>
</div>

<!-- 달력 -->
<div class="calendar-wrap">
    <div class="cal-dow-row">
        <span class="cal-dow">일</span>
        <span class="cal-dow">월</span>
        <span class="cal-dow">화</span>
        <span class="cal-dow">수</span>
        <span class="cal-dow">목</span>
        <span class="cal-dow">금</span>
        <span class="cal-dow">토</span>
    </div>
    <div class="cal-grid" id="calGrid">
        <!-- JS로 렌더링 -->
    </div>
</div>

<!-- 범례 -->
<div class="legend">
    <span><span class="legend-box" style="background:#8b5a2b;"></span>주문 있는 날</span>
    <span><span class="legend-box" style="background:white; outline:3px solid #e8a020; outline-offset:-3px;"></span>오늘</span>
</div>

<!-- 주문 목록 -->
<div class="orders-section">

    <div th:if="${byDate.isEmpty()}" class="empty-msg">
        이번 달 등록된 주문이 없습니다.<br>
        <span style="color:#bbb; font-size:0.9rem;">다른 달을 선택해 보세요.</span>
    </div>

    <div th:each="entry : ${byDate}">
        <!-- 날짜 헤더 -->
        <div class="date-heading"
             th:id="'day-' + ${entry.key.dayOfMonth}"
             th:text="${#temporals.format(entry.key, 'M월 d일 (E)')}">
        </div>

        <!-- 해당 날짜 주문 카드들 -->
        <div th:each="order : ${entry.value}"
             th:class="${order.deliveryDate == today} ? 'order-card today-card' : 'order-card'">

            <div class="recipient-row">
                <span class="recipient-name" th:text="${order.recipientName}"></span>
                <span class="recipient-phone" th:text="${order.recipientPhone}"></span>
            </div>

            <div class="info-line" th:if="${order.recipientAddress != null and !order.recipientAddress.isBlank()}">
                <strong>주소</strong> : <span th:text="${order.recipientAddress}"></span>
            </div>

            <div th:if="${order.menuDescription != null and !order.menuDescription.isBlank()}"
                 class="menu-box" th:text="${order.menuDescription}"></div>

            <div class="status-row">
                <span th:if="${order.paid}" class="badge-paid">✅ 입금완료</span>
                <span th:unless="${order.paid}" class="badge-unpaid">❌ 미입금</span>
                <span th:if="${order.trackingNumber != null and !order.trackingNumber.isBlank()}"
                      class="tracking-chip"
                      th:text="'송장 : ' + ${order.trackingNumber}"></span>
            </div>

            <div class="info-line" th:if="${order.memo != null and !order.memo.isBlank()}"
                 style="margin-top:8px; color:#888;">
                <strong>메모</strong> : <span th:text="${order.memo}"></span>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const year  = /*[[${ym.year}]]*/ 2025;
    const month = /*[[${ym.monthValue}]]*/ 1;
    const today = /*[[${today.dayOfMonth}]]*/ 0;
    const todayYear  = /*[[${today.year}]]*/ 0;
    const todayMonth = /*[[${today.monthValue}]]*/ 0;
    const orderDays  = new Set(/*[[${orderDays}]]*/ []);

    const grid = document.getElementById('calGrid');
    const firstDay = new Date(year, month - 1, 1).getDay(); // 0=일
    const lastDay  = new Date(year, month, 0).getDate();

    // 빈 칸
    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-cell empty';
        grid.appendChild(empty);
    }

    // 날짜 칸
    for (let d = 1; d <= lastDay; d++) {
        const dow = (firstDay + d - 1) % 7;
        const cell = document.createElement('div');
        const isToday = (d === today && year === todayYear && month === todayMonth);
        const hasOrder = orderDays.has(d);

        let cls = 'cal-cell';
        if (dow === 0) cls += ' sun';
        if (dow === 6) cls += ' sat';
        if (hasOrder) cls += ' has-order';
        if (isToday)  cls += ' is-today';
        cell.className = cls;

        const num = document.createElement('span');
        num.className = 'cal-day-num';
        num.textContent = d;
        cell.appendChild(num);

        if (hasOrder) {
            const dot = document.createElement('span');
            dot.className = 'order-dot';
            dot.textContent = '●';
            cell.appendChild(dot);

            cell.addEventListener('click', () => {
                const target = document.getElementById('day-' + d);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        }

        grid.appendChild(cell);
    }
</script>

</body>
</html>
