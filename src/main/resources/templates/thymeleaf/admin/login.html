<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 로그인 | 대원</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="card shadow" style="max-width:400px; width:100%;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h4 class="fw-bold" style="color:#8b5a2b;">대원 관리자</h4>
                <p class="text-muted small">갤러리 관리 페이지입니다</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2 small">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2 small">
                로그아웃 되었습니다.
            </div>

            <form th:action="@{/admin/login}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">아이디</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold">비밀번호</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn w-100 text-white fw-bold"
                        style="background:#8b5a2b; border-color:#8b5a2b;">로그인</button>
            </form>

            <div class="text-center mt-3">
                <a href="/" class="text-muted small">← 홈으로 돌아가기</a>
            </div>
        </div>
    </div>
</body>
</html>
