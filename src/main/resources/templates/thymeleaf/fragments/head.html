<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="headFragment(title, description, keywords, canonicalUrl)">

  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- SEO Meta Tags -->

  <meta name="naver-site-verification" content="d5c50b0aaf26df9434abf8b1bacc0c12c9542144" />
  <meta name="google-site-verification" content="wlUTPoCV3ciq-c5HQFXUYQj2S54pLKEZlSXKdzViHfs" />

  <title th:text="${title} ?: '청주 제사음식·단체음식 전문 대원 | 시제 상차림·체육행사 배달음식'">청주 제사음식·단체음식 전문 대원 | 시제 상차림·체육행사 배달음식</title>


  <!-- Open Graph (카카오/SNS 공유 시 미리보기) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="대원">
  <meta property="og:title" th:content="${title} ?: '청주 제사음식·단체음식 전문 대원 | 시제 상차림·체육행사 배달음식'">
  <meta property="og:description" th:content="${description} ?: '청주 제사음식, 청주 단체음식 전문 대원입니다. 한식날 시제상차림, 체육행사 배달음식, 청주 제사상 맞춤, 시제 상차림을 당일 새벽에 정성껏 조리하여 배달해 드립니다.'">
  <meta property="og:image" content="https://daewon.up.railway.app/assets/img/menu/menu-jesa.jpg">
  <meta property="og:url" th:content="${canonicalUrl} ?: 'https://daewon.up.railway.app/'">
  <meta property="og:locale" content="ko_KR">
  <link rel="canonical" th:href="${canonicalUrl} ?: 'https://daewon.up.railway.app/'">

  <!-- JSON-LD 구조화 데이터 (구글/네이버 지역업체 인식) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": ["LocalBusiness", "CateringService"],
      "name": "대원 케이터링",
      "description": "충북 청주 한식 케이터링. 제사음식·시제상·단체음식 전문. 당일 새벽 직접 조리 후 전국 배달.",
      "url": "https://daewon.up.railway.app/",
      "telephone": "010-8916-7074",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "비하로 27",
        "addressLocality": "청주시 흥덕구",
        "addressRegion": "충청북도",
        "addressCountry": "KR"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 36.6425,
        "longitude": 127.42
      },
      "areaServed": ["청주시", "충청북도", "대한민국"],
      "openingHours": "Mo-Su 07:00-20:00",
      "hasMap": "https://map.kakao.com/?q=충북+청주시+흥덕구+비하로+27",
      "servesCuisine": "Korean",
      "priceRange": "$$",
      "image": "https://daewon.up.railway.app/assets/img/menu/menu-jesa.jpg",
      "taxID": "764-06-00988",
      "sameAs": [
        "https://pf.kakao.com/_cEzZX"
      ]
    }
    </script>

  <!-- Bootstrap CSS -->
  <link href="/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet"
    onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css';">
  <!-- FontAwesome (Icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" th:href="@{/css/custom.css}">
  <link rel="stylesheet" th:href="@{/css/subpages.css}">
  <!-- Bootstrap JS (defer: body 파싱 완료 후 실행) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
  <!-- CTA 클릭 트래킹 -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('a[href^="tel:"], a[href*="pf.kakao.com"]').forEach(function (el) {
        el.addEventListener('click', function () {
          var type = el.href.startsWith('tel:') ? 'PHONE' : 'KAKAO';
          var page = window.location.pathname;
          fetch('/track/cta?type=' + type + '&page=' + encodeURIComponent(page), { keepalive: true });
        });
      });
    });
  </script>
</head>

</html>
