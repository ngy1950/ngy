<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head
    th:replace="~{fragments/head :: headFragment('대원 | 갤러리', '대원의 정성스러운 제사음식, 장지음식, 단체음식, 프리미엄 도시락 사진을 확인하세요.', '제사음식사진, 장지음식사진, 단체음식갤러리, 도시락사진')}">
</head>

<body>
    <!-- Navigation 공통 레이아웃 교체 -->
    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <!-- Subpage Hero -->
    <header class="sub-hero-section" style="background-image: linear-gradient(rgba(44,39,36,0.75), rgba(44,39,36,0.75)), url('https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center;">
        <div class="container text-center text-white">
            <h1 class="animate__animated animate__fadeInDown">갤러리</h1>
            <p class="animate__animated animate__fadeInUp mt-3" style="font-size: 1.2rem;">대원의 정성스러운 음식 모습을 직접 확인하세요</p>
        </div>
    </header>

    <!-- Gallery Section -->
    <section class="section-padding">
        <div class="container">

            <!-- 필터 버튼 -->
            <div class="gallery-filter-wrap">
                <button class="gallery-filter-btn active" data-filter="all">전체</button>
                <button class="gallery-filter-btn" data-filter="jesa">제사·시제음식</button>
                <button class="gallery-filter-btn" data-filter="jangji">장지음식</button>
                <button class="gallery-filter-btn" data-filter="group">단체·행사음식</button>
            </div>

            <!-- 갤러리 그리드 -->
            <!-- TODO: 아래 모든 이미지는 AI 생성 이미지 또는 실제 사진으로 교체 예정 -->
            <div class="row" id="galleryGrid">

                <!-- 제사음식 -->
                <div class="col-md-4 gallery-col" data-category="jesa">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/jesa1/600/440" alt="정성스러운 기제사 상차림">
                        <div class="gallery-item-label">정성스러운 기제사 상차림</div>
                    </div>
                </div>
                <div class="col-md-4 gallery-col" data-category="jesa">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/jesa2/600/440" alt="추석 차례상 세트">
                        <div class="gallery-item-label">추석 차례상 세트</div>
                    </div>
                </div>
                <div class="col-md-4 gallery-col" data-category="jesa">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/jesa3/600/440" alt="문중 시제 대형 상차림">
                        <div class="gallery-item-label">문중 시제 대형 상차림</div>
                    </div>
                </div>

                <!-- 장지음식 -->
                <div class="col-md-4 gallery-col" data-category="jangji">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/jangji1/600/440" alt="개별 포장 장지 상차림">
                        <div class="gallery-item-label">개별 포장 장지 상차림</div>
                    </div>
                </div>
                <div class="col-md-4 gallery-col" data-category="jangji">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/jangji2/600/440" alt="현장 배송 완료">
                        <div class="gallery-item-label">현장 배송 완료 모습</div>
                    </div>
                </div>
                <div class="col-md-4 gallery-col" data-category="jangji">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/jangji3/600/440" alt="프리미엄 조문객 상차림">
                        <div class="gallery-item-label">프리미엄 조문객 상차림</div>
                    </div>
                </div>

                <!-- 단체음식 -->
                <div class="col-md-4 gallery-col" data-category="group">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/group1/600/440" alt="체육대회 배식 세팅">
                        <div class="gallery-item-label">체육대회 현장 배식 세팅</div>
                    </div>
                </div>
                <div class="col-md-4 gallery-col" data-category="group">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/group2/600/440" alt="워크샵 뷔페 배식">
                        <div class="gallery-item-label">워크샵 뷔페 자율배식</div>
                    </div>
                </div>
                <div class="col-md-4 gallery-col" data-category="group">
                    <div class="gallery-item">
                        <img src="https://picsum.photos/seed/group3/600/440" alt="야외 바베큐 출장">
                        <div class="gallery-item-label">야외 바베큐 출장 현장</div>
                    </div>
                </div>


            </div><!-- /galleryGrid -->

            <div class="text-center mt-5">
                <p class="text-muted fst-italic mb-4">* 위 사진들은 임시 이미지입니다. 실제 음식 사진으로 곧 교체될 예정입니다.</p>
                <a th:href="@{/#contact}" class="btn btn-point px-5 py-3" style="border-radius: 50px;">
                    <i class="fas fa-comment-dots me-2"></i>견적 및 예약 문의
                </a>
            </div>

        </div>
    </section>

    <!-- Footer 공통 레이아웃 교체 -->
    <div th:replace="~{fragments/footer :: footerFragment}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 갤러리 카테고리 필터
        const filterBtns = document.querySelectorAll('.gallery-filter-btn');
        const galleryCols = document.querySelectorAll('.gallery-col');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function () {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                const filter = this.dataset.filter;
                galleryCols.forEach(col => {
                    if (filter === 'all' || col.dataset.category === filter) {
                        col.style.display = '';
                    } else {
                        col.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>

</html>
