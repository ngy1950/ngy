<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- =============================================
         CTA 버튼 쌍: 전화상담 + 카카오톡 견적문의
         사용법: <div th:replace="~{fragments/subpage :: ctaPairFragment}"></div>
         ============================================= -->
    <th:block th:fragment="ctaPairFragment">
        <div class="cta-pair">
            <a href="tel:010-8916-7074" class="btn btn-phone-call">
                <i class="fas fa-phone-alt"></i>전화상담
            </a>
            <a href="https://pf.kakao.com/_cEzZX/chat" target="_blank" rel="noopener" class="btn btn-kakao">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="#191919"
                    style="flex-shrink:0">
                    <path
                        d="M12 3C6.477 3 2 6.477 2 10.5c0 2.63 1.576 4.955 3.97 6.33L4.5 21l5.02-2.67A11.26 11.26 0 0 0 12 18c5.523 0 10-3.477 10-7.5S17.523 3 12 3z" />
                </svg>카카오톡 견적문의
            </a>
            <button type="button" class="btn btn-inquiry" data-bs-toggle="modal" data-bs-target="#inquiryModal">
                <i class="fas fa-pen-to-square me-1"></i>문의 남기기
            </button>
        </div>

        <!-- 견적 문의 모달 -->
        <div class="modal fade" id="inquiryModal" tabindex="-1" aria-labelledby="inquiryModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="inquiryModalLabel">
                            <i class="fas fa-pen me-2"></i>견적 문의 남기기
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                    </div>
                    <div class="modal-body">
                        <p class="text-muted mb-3" style="font-size:0.9rem;">
                            전화가 부담스러우시면 연락처만 남겨주세요.<br>
                            영업시간 내 빠르게 연락드리겠습니다.
                        </p>
                        <form id="contactForm">
                            <div class="mb-3">
                                <label for="inquiryName" class="form-label fw-semibold">이름 <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="inquiryName" name="name"
                                       placeholder="홍길동" required>
                            </div>
                            <div class="mb-3">
                                <label for="inquiryPhone" class="form-label fw-semibold">연락처 <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="inquiryPhone" name="phone"
                                       placeholder="010-0000-0000" oninput="phoneCheck(this)" required>
                            </div>
                            <div class="mb-3">
                                <label for="inquiryMemo" class="form-label fw-semibold">
                                    문의 내용 <span class="text-muted fw-normal">(선택)</span>
                                </label>
                                <textarea class="form-control" id="inquiryMemo" name="memo" rows="3"
                                          placeholder="예) 제사 10인분 12월 25일, 장지 30인분 가능한지 등"></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-primary" onclick="reservation()">
                            <i class="fas fa-paper-plane me-1"></i>견적 요청하기
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <!-- =============================================
         원산지 표기 섹션
         사용법:
           <section th:replace="~{fragments/subpage :: originSection(~{:: #origin-rows})}">
               <tbody id="origin-rows">
                   <tr><td>품목</td><td>해당음식</td><td>원산지</td></tr>
                   ...
               </tbody>
           </section>
         ============================================= -->
    <section th:fragment="originSection(tableRows)" class="origin-section">
        <div class="container">
            <div class="section-title text-center mb-4">
                <h2>원산지 표기</h2>
                <p>농수산물의 원산지 표시에 관한 법령에 따라 주요 식재료의 원산지를 표기합니다.</p>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="table-responsive">
                        <table class="origin-table">
                            <thead>
                                <tr>
                                    <th style="width: 30%;">품목</th>
                                    <th style="width: 40%;">해당 음식</th>
                                    <th style="width: 30%;">원산지</th>
                                </tr>
                            </thead>
                            <tbody th:replace="${tableRows}">
                            </tbody>
                        </table>
                    </div>


                </div>
            </div>
        </div>
    </section>

</body>

</html>
