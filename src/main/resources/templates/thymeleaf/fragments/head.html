<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="headFragment(title, description, keywords)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- SEO Meta Tags -->
    <meta name="description" th:content="${description} ?: '정성을 담은 한 상, 대원밥집. 제사음식, 시제음식, 장지음식, 단체음식을 정성을 다해 준비합니다.'">
    <meta name="keywords" th:content="${keywords} ?: '대원밥집, 제사음식, 시제음식, 장지음식, 단체음식, 맞춤도시락, 출장뷔페'">

    <title th:text="${title} ?: '대원밥집 | 정성을 담은 프리미엄 한 상'">대원밥집 | 정성을 담은 프리미엄 한 상</title>

    <!-- Bootstrap CSS -->
    <link href="/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css';">
    <!-- FontAwesome (Icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

</html>
