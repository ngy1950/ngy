<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>관리자 대시보드 | 대원</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark px-4 py-2" style="background:#5c3d1e;">
        <span class="navbar-brand fw-bold">대원 관리자 대시보드</span>
        <div class="d-flex align-items-center gap-3">
            <a th:href="@{/admin/gallery/new}" class="btn btn-sm btn-warning fw-bold">
                <i class="fas fa-plus me-1"></i> 새 사진 등록
            </a>
            <a th:href="@{/gallery}" class="text-white-50 small">갤러리 보기</a>
            <form th:action="@{/admin/logout}" method="post" class="mb-0">
                <button type="submit" class="btn btn-sm btn-outline-light">로그아웃</button>
            </form>
        </div>
    </nav>

    <div class="container py-4">

        <!-- 순 방문자 요약 (IP 기준 중복 제거) -->
        <div class="row g-3 mb-3">
            <div th:each="entry : ${uniqueVisitorCounts}" class="col-4">
                <div class="card shadow-sm text-center border-0" style="background:#f8f4ef;">
                    <div class="card-body py-2">
                        <div class="fw-bold fs-3" style="color:#5c3d1e;" th:text="${entry.value}">0</div>
                        <div class="small text-muted">순 방문자 <span th:text="'(' + ${entry.key} + ')'"></span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 방문자 통계 요약 카드 -->
        <div class="row g-3 mb-4">
            <!-- 기기 분포 -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold small" style="background:#3a5a3a; color:white;">
                        <i class="fas fa-mobile-alt me-1"></i> 기기 유형 <span class="fw-normal">(최근 7일)</span>
                    </div>
                    <div class="card-body">
                        <div th:if="${deviceStats.isEmpty()}" class="text-center text-muted small py-2">데이터 없음</div>
                        <div th:unless="${deviceStats.isEmpty()}">
                            <div th:each="entry : ${deviceStats}" class="d-flex justify-content-between align-items-center mb-2">
                                <span class="small">
                                    <i th:classappend="${entry.key == 'MOBILE'} ? 'fa-mobile-alt' : (${entry.key == 'TABLET'} ? 'fa-tablet-alt' : 'fa-desktop')"
                                       class="fas me-1 text-muted"></i>
                                    <span th:text="${entry.key}"></span>
                                </span>
                                <span class="badge bg-secondary" th:text="${entry.value}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 유입 경로 -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold small" style="background:#3a5a3a; color:white;">
                        <i class="fas fa-route me-1"></i> 유입 경로 <span class="fw-normal">(최근 7일)</span>
                    </div>
                    <div class="card-body">
                        <div th:if="${referrerStats.isEmpty()}" class="text-center text-muted small py-2">데이터 없음</div>
                        <div th:unless="${referrerStats.isEmpty()}">
                            <div th:each="entry : ${referrerStats}" class="d-flex justify-content-between align-items-center mb-2">
                                <span class="small" th:text="${entry.key}"></span>
                                <span class="badge bg-secondary" th:text="${entry.value}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- IP 현황 -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold small" style="background:#3a5a3a; color:white;">
                        <i class="fas fa-network-wired me-1"></i> IP 현황 <span class="fw-normal">(최근 24h)</span>
                    </div>
                    <div class="card-body">
                        <div th:if="${ipStats.isEmpty()}" class="text-center text-muted small py-2">데이터 없음</div>
                        <div th:unless="${ipStats.isEmpty()}">
                            <div th:each="entry : ${ipStats}" class="d-flex justify-content-between align-items-center mb-1">
                                <span class="small text-monospace" style="font-family:monospace;" th:text="${entry.key}"></span>
                                <span class="badge bg-secondary" th:text="${entry.value}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 최근 방문 로그 -->
        <div class="card shadow-sm mb-4">
            <div class="card-header fw-bold" style="background:#3a5a3a; color:white;">
                <i class="fas fa-list-alt me-2"></i> 최근 방문 로그
                <button class="btn btn-sm btn-outline-light ms-2 float-end" type="button"
                        data-bs-toggle="collapse" data-bs-target="#rawLogTable">펼치기/접기</button>
            </div>
            <div class="collapse show" id="rawLogTable">
                <div th:if="${#lists.isEmpty(recentRawLogs)}" class="text-center py-4 text-muted">
                    아직 기록된 방문자 데이터가 없습니다.
                </div>
                <div th:unless="${#lists.isEmpty(recentRawLogs)}" class="table-responsive">
                    <table class="table table-sm table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>시각</th>
                                <th>페이지</th>
                                <th>IP</th>
                                <th>유입</th>
                                <th>기기</th>
                                <th>세션 흐름</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${recentRawLogs}">
                                <td class="small text-muted text-nowrap"
                                    th:text="${#temporals.format(log.visitedAt, 'MM-dd HH:mm')}"></td>
                                <td class="small" th:text="${log.page}"></td>
                                <td class="small" style="font-family:monospace;" th:text="${log.ip}"></td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${log.referrerSource == 'DIRECT'} ? 'bg-secondary' :
                                                          (${log.referrerSource == 'NAVER'} ? 'bg-success' :
                                                          (${log.referrerSource == 'GOOGLE'} ? 'bg-primary' :
                                                          (${log.referrerSource == 'KAKAO'} ? 'bg-warning text-dark' : 'bg-info')))"
                                          th:text="${log.referrerSource}"></span>
                                </td>
                                <td>
                                    <i th:classappend="${log.deviceType == 'MOBILE'} ? 'fa-mobile-alt' :
                                                       (${log.deviceType == 'TABLET'} ? 'fa-tablet-alt' : 'fa-desktop')"
                                       class="fas text-muted"></i>
                                    <span class="small ms-1" th:text="${log.deviceType}"></span>
                                </td>
                                <td>
                                    <button class="btn btn-xs btn-outline-secondary btn-sm py-0 px-1 small"
                                            th:data-session-id="${log.sessionId}"
                                            onclick="showFlow(this.dataset.sessionId)">
                                        흐름 보기
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 페이지별 집계 (기존) -->
        <div class="card shadow-sm mb-4">
            <div class="card-header fw-bold" style="background:#3a5a3a; color:white;">
                <i class="fas fa-chart-bar me-2"></i> 페이지별 방문 집계 <span class="fw-normal small">(최근 14일)</span>
                <button class="btn btn-sm btn-outline-light ms-2 float-end" type="button"
                        data-bs-toggle="collapse" data-bs-target="#aggregateTable">펼치기/접기</button>
            </div>
            <div class="collapse" id="aggregateTable">
                <div th:if="${#lists.isEmpty(visitorStats)}" class="text-center py-4 text-muted">
                    아직 기록된 방문자 데이터가 없습니다.
                </div>
                <div th:unless="${#lists.isEmpty(visitorStats)}" class="table-responsive">
                    <table class="table table-sm table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>날짜</th>
                                <th>페이지</th>
                                <th class="text-end">방문수</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${visitorStats}">
                                <td class="small text-muted" th:text="${log.date}"></td>
                                <td class="small" th:text="${log.page}"></td>
                                <td class="text-end fw-semibold" th:text="${log.count}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 세션 흐름 모달 -->
        <div class="modal fade" id="flowModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h6 class="modal-title">방문자 페이지 이동 흐름</h6>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body" id="flowBody">
                        <div class="text-center text-muted">불러오는 중...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 게시물 목록 -->
        <div class="card shadow-sm mb-5">
            <div class="card-header fw-bold" style="background:#8b5a2b; color:white;">
                <i class="fas fa-images me-2"></i> 갤러리 게시물
                <span class="badge bg-white text-dark ms-2" th:text="${#lists.size(posts)}"></span>
            </div>
            <div class="card-body p-0">
                <div th:if="${#lists.isEmpty(posts)}" class="text-center py-4 text-muted">
                    등록된 게시물이 없습니다.
                </div>
                <table th:unless="${#lists.isEmpty(posts)}" class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width:80px;">미리보기</th>
                            <th>제목</th>
                            <th>카테고리</th>
                            <th>행사일</th>
                            <th>등록일</th>
                            <th style="width:120px;">관리</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="post : ${posts}">
                            <td>
                                <img th:if="${post.thumbnailUrl != null}" th:src="${post.thumbnailUrl}" class="rounded"
                                    style="width:60px; height:45px; object-fit:cover;">
                                <div th:unless="${post.thumbnailUrl != null}"
                                    class="bg-light rounded d-flex align-items-center justify-content-center text-muted"
                                    style="width:60px; height:45px;">
                                    <i class="fas fa-image"></i>
                                </div>
                            </td>
                            <td>
                                <a th:href="@{/gallery/{id}(id=${post.id})}" th:text="${post.title}"
                                    class="text-decoration-none text-dark fw-semibold"></a>
                            </td>
                            <td><span class="badge text-white" style="background:#8b5a2b;"
                                    th:text="${post.categoryLabel}"></span></td>
                            <td th:text="${post.eventDate != null} ? ${#temporals.format(post.eventDate, 'yyyy.MM.dd')} : '-'"
                                class="small text-muted"></td>
                            <td th:text="${#temporals.format(post.createdAt, 'yyyy.MM.dd')}" class="small text-muted">
                            </td>
                            <td>
                                <form th:action="@{/admin/gallery/{id}/delete(id=${post.id})}" method="post"
                                    onsubmit="return confirm('정말 삭제하시겠습니까?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="fas fa-trash"></i> 삭제
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ===== 승인 기능 비활성화 중 (필요 시 주석 해제) =====
    승인 없이 리뷰가 바로 게시됩니다. ReviewService.addReview() 에서 setApproved(true) 참고.
    -->

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showFlow(sessionId) {
            const modal = new bootstrap.Modal(document.getElementById('flowModal'));
            const body = document.getElementById('flowBody');
            body.innerHTML = '<div class="text-center text-muted py-3"><i class="fas fa-spinner fa-spin me-2"></i>불러오는 중...</div>';
            modal.show();

            fetch('/admin/visitor/session/' + sessionId)
                .then(res => res.json())
                .then(logs => {
                    if (!logs || logs.length === 0) {
                        body.innerHTML = '<p class="text-muted text-center py-3">기록된 흐름 데이터가 없습니다.</p>';
                        return;
                    }
                    let html = '<ol class="list-group list-group-numbered">';
                    logs.forEach(log => {
                        const d = new Date(log.time);
                        const time = d.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
                        const date = d.toLocaleDateString('ko-KR', {month: '2-digit', day: '2-digit'});
                        const icon = log.device === 'MOBILE' ? 'fa-mobile-alt' :
                                     log.device === 'TABLET' ? 'fa-tablet-alt' : 'fa-desktop';
                        html += `<li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><i class="fas ${icon} text-muted me-2"></i><code>${log.page}</code></span>
                            <small class="text-muted text-nowrap ms-3">${date} ${time}</small>
                        </li>`;
                    });
                    html += '</ol>';
                    body.innerHTML = html;
                })
                .catch(() => {
                    body.innerHTML = '<p class="text-danger text-center py-3">데이터를 불러오지 못했습니다.</p>';
                });
        }
    </script>
</body>

</html>
