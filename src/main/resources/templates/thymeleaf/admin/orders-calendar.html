<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${ym.year + '년 ' + ym.monthValue + '월 주문현황'}">주문현황</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        * { box-sizing: border-box; }
        body { background: #f5f2ee; font-size: 18px; color: #2c2724; }

        /* 상단 바 */
        .top-bar {
            background: #5c3d1e;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 800;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* 월 이동 */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px 10px;
            background: white;
            border-bottom: 1px solid #ede8e0;
        }
        .month-nav a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f0e9df;
            color: #5c3d1e;
            font-size: 1.4rem;
            font-weight: 900;
            text-decoration: none;
        }
        .month-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: #2c2724;
        }

        /* 달력 */
        .calendar-wrap { background: white; padding: 0 8px 12px; }
        .cal-dow-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            padding: 6px 0 4px;
        }
        .cal-dow {
            font-size: 0.8rem;
            font-weight: 700;
            color: #999;
        }
        .cal-dow:first-child { color: #e05555; }
        .cal-dow:last-child  { color: #5588e0; }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .cal-cell {
            min-height: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: default;
            position: relative;
        }
        .cal-cell.empty { background: transparent; }
        .cal-cell.has-order {
            background: #8b5a2b;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(0,0,0,0.1);
        }
        .cal-cell.has-order:active { background: #7a4e26; }
        .cal-cell.is-today {
            outline: 3px solid #e8a020;
            outline-offset: -3px;
        }
        .cal-day-num {
            font-size: 18px;
            font-weight: 700;
            line-height: 1;
        }
        .cal-cell.has-order .cal-day-num { color: white; }
        .cal-cell:not(.has-order) .cal-day-num { color: #2c2724; }
        .cal-cell.sun:not(.has-order) .cal-day-num { color: #e05555; }
        .cal-cell.sat:not(.has-order) .cal-day-num { color: #5588e0; }
        .order-dot {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.9);
            font-weight: 700;
            margin-top: 2px;
        }

        /* 범례 */
        .legend {
            display: flex;
            gap: 16px;
            padding: 8px 16px 12px;
            background: white;
            font-size: 0.85rem;
            color: #777;
            border-bottom: 1px solid #ede8e0;
        }
        .legend-box {
            display: inline-block;
            width: 20px; height: 20px;
            border-radius: 6px;
            vertical-align: middle;
            margin-right: 5px;
        }

        /* 주문 섹션 */
        .orders-section { padding: 16px 12px 40px; }
        .date-heading {
            font-size: 1.1rem;
            font-weight: 800;
            color: #5c3d1e;
            margin: 20px 0 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #e0d5c8;
            scroll-margin-top: 80px;
        }
        .order-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            margin-bottom: 14px;
            padding: 16px;
            scroll-margin-top: 80px;
        }
        .order-card.action-today-card { border: 3px solid #e8a020; }
        .action-banner {
            background: #e8a020;
            color: white;
            font-size: 17px;
            font-weight: 800;
            padding: 10px 14px;
            border-radius: 10px 10px 0 0;
            margin: -16px -16px 14px -16px;
            letter-spacing: 0.02em;
        }
        .recipient-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .recipient-name { font-size: 24px; font-weight: 800; }
        .recipient-phone { font-size: 20px; color: #555; }
        .info-line {
            font-size: 17px;
            color: #444;
            margin-top: 5px;
            line-height: 1.6;
            word-break: keep-all;
        }
        .info-line strong { color: #5c3d1e; }
        .menu-box {
            background: #faf7f3;
            border-left: 4px solid #c8a87a;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            margin-top: 10px;
            font-size: 17px;
            white-space: pre-wrap;
            word-break: keep-all;
            line-height: 1.7;
        }
        .status-row { margin-top: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .badge-paid   { background: #d1f0e0; color: #198754; font-weight: 700; padding: 8px 18px; border-radius: 20px; font-size: 17px; }
        .badge-unpaid { background: #fde8e8; color: #dc3545; font-weight: 700; padding: 8px 18px; border-radius: 20px; font-size: 17px; }
        .tracking-chip { background: #f0e9df; color: #5c3d1e; font-size: 16px; padding: 6px 14px; border-radius: 20px; font-weight: 600; }
        .today-action-section { margin-bottom: 28px; }
        .today-action-title { font-size: 1.1rem; font-weight: 800; color: #dc3545; margin-bottom: 10px; }

        .empty-msg { text-align: center; padding: 48px 16px; color: #aaa; font-size: 1.05rem; line-height: 2; }

        /* 임박 배송 달력 셀 */
        .cal-cell.is-soon { background: #e8a020; cursor: pointer; }
        .cal-cell.is-soon .cal-day-num { color: white; }
        .cal-cell.is-soon:active { background: #d09010; }

        /* 상단 경고 배너 */
        .alert-banner {
            background: #fff8e6;
            border-left: 5px solid #e8a020;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 700;
            color: #7a5200;
            display: none;
        }

        /* D-day 뱃지 */
        .dday-chip {
            display: inline-block;
            background: #e8a020;
            color: white;
            font-size: 0.78rem;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
            animation: blink-soft 1.6s ease-in-out infinite;
        }
        .dday-chip.dday-0 { background: #dc3545; }
        .dday-chip.warning-chip { background: #dc3545; animation: none; }
        .type-chip { font-size: 15px; font-weight: 700; padding: 6px 14px; border-radius: 20px; }
        .type-parcel { background: #e8f0fe; color: #1a56c4; }
        .type-direct { background: #e8f4e8; color: #2d7a2d; }

        @keyframes blink-soft {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.55; }
        }
    </style>
</head>
<body>

<div class="top-bar">🗓 대원 주문현황</div>

<div id="alertBanner" class="alert-banner">
    ⚠️ 1~2일 내 배송 예정이 있습니다. 아래에서 확인하세요 👇
</div>

<!-- 월 이동 -->
<div class="month-nav">
    <a th:href="@{/schedule/{t}(t=${token}, year=${prevYm.year}, month=${prevYm.monthValue})}">&lsaquo;</a>
    <span class="month-title" th:text="${ym.year + '년 ' + ym.monthValue + '월'}"></span>
    <a th:href="@{/schedule/{t}(t=${token}, year=${nextYm.year}, month=${nextYm.monthValue})}">&rsaquo;</a>
</div>

<!-- 달력 -->
<div class="calendar-wrap">
    <div class="cal-dow-row">
        <span class="cal-dow">일</span>
        <span class="cal-dow">월</span>
        <span class="cal-dow">화</span>
        <span class="cal-dow">수</span>
        <span class="cal-dow">목</span>
        <span class="cal-dow">금</span>
        <span class="cal-dow">토</span>
    </div>
    <div class="cal-grid" id="calGrid">
        <!-- JS로 렌더링 -->
    </div>
</div>

<!-- 범례 -->
<div class="legend">
    <span><span class="legend-box" style="background:#8b5a2b;"></span>주문 있는 날</span>
    <span><span class="legend-box" style="background:#e8a020;"></span>2일 이내</span>
    <span><span class="legend-box" style="background:white; outline:3px solid #e8a020; outline-offset:-3px;"></span>오늘</span>
</div>

<!-- 주문 목록 -->
<div class="orders-section">

    <!-- 오늘 처리할 주문 (있을 때만 표시) -->
    <div th:if="${!todayActionOrders.isEmpty()}" class="today-action-section">
        <div class="today-action-title">🔔 오늘 처리할 주문 <span th:text="'(' + ${todayActionOrders.size()} + '건)'"></span></div>
        <div th:each="order : ${todayActionOrders}" class="order-card action-today-card">
            <div class="action-banner">🚚 오늘 배송 — 지금 준비하세요!</div>
            <div class="recipient-row">
                <span class="recipient-name" th:text="${order.recipientName}"></span>
                <span class="recipient-phone" th:text="${order.recipientPhone}"></span>
            </div>
            <div class="info-line" th:if="${order.recipientAddress != null and !order.recipientAddress.isBlank()}">
                <strong>주소</strong> : <span th:text="${order.recipientAddress}"></span>
            </div>
            <div th:if="${order.menuDescription != null and !order.menuDescription.isBlank()}"
                 class="menu-box" th:text="${order.menuDescription}"></div>
            <div class="status-row">
                <span th:class="${order.deliveryType == '직접배송'} ? 'type-chip type-direct' : 'type-chip type-parcel'">
                    <span th:if="${order.deliveryType == '직접배송'}">🚗 직접배송</span>
                    <span th:unless="${order.deliveryType == '직접배송'}">📦 택배</span>
                </span>
                <span th:if="${order.paid}" class="badge-paid">✅ 입금완료</span>
                <span th:unless="${order.paid}" class="badge-unpaid">❌ 미입금</span>
                <span th:if="${order.trackingNumber != null and !order.trackingNumber.isBlank()}"
                      class="tracking-chip" th:text="'송장 : ' + ${order.trackingNumber}"></span>
            </div>
            <div class="info-line" th:if="${order.memo != null and !order.memo.isBlank()}"
                 style="margin-top:8px; color:#888;">
                <strong>메모</strong> : <span th:text="${order.memo}"></span>
            </div>
        </div>
        <hr style="border-color:#e0d5c8; margin: 8px 0 20px;">
    </div>

    <div th:if="${byDate.isEmpty()}" class="empty-msg">
        이번 달 등록된 주문이 없습니다.<br>
        <span style="color:#bbb; font-size:0.9rem;">다른 달을 선택해 보세요.</span>
    </div>

    <div th:each="entry : ${byDate}">
        <!-- 날짜 헤더 -->
        <div class="date-heading"
             th:id="'day-' + ${entry.key.dayOfMonth}"
             th:with="isDirectDay=${directDeliveryDays.contains(entry.key.dayOfMonth)},
                      dow=${entry.key.dayOfWeek.value},
                      effDate=${isDirectDay ? entry.key : (dow == 7 ? entry.key.minusDays(2) : (dow == 1 ? entry.key.minusDays(3) : entry.key.minusDays(1)))},
                      diff=${effDate.toEpochDay() - today.toEpochDay()}">
            <span th:text="${#temporals.format(entry.key, 'M월 d일 (E)')}"></span>
            <!-- 일/월 배송 + 택배인 경우만 토수령 안내 -->
            <span th:if="${!isDirectDay and (dow == 7 or dow == 1)}" class="dday-chip warning-chip">⚠️ 토요일 수령 안내</span>
            <!-- 발송 타이밍 뱃지 -->
            <span th:if="${diff == 0}" class="dday-chip dday-0">오늘 배송</span>
            <span th:if="${diff == 1}" class="dday-chip">D-1</span>
            <span th:if="${diff == 2}" class="dday-chip">D-2</span>
        </div>

        <!-- 해당 날짜 주문 카드들 -->
        <div th:each="order : ${entry.value}"
             th:with="isDirectOrder=${order.deliveryType == '직접배송'},
                      orderDow=${order.deliveryDate.dayOfWeek.value},
                      orderEffDate=${isDirectOrder ? order.deliveryDate :
                                     (orderDow == 7 ? order.deliveryDate.minusDays(2) :
                                      (orderDow == 1 ? order.deliveryDate.minusDays(3) :
                                       order.deliveryDate.minusDays(1)))},
                      isActionToday=${orderEffDate == today}"
             th:class="${isActionToday} ? 'order-card action-today-card' : 'order-card'">

            <div th:if="${isActionToday}" class="action-banner">🚚 오늘 배송 — 지금 준비하세요!</div>

            <div class="recipient-row">
                <span class="recipient-name" th:text="${order.recipientName}"></span>
                <span class="recipient-phone" th:text="${order.recipientPhone}"></span>
            </div>

            <div class="info-line" th:if="${order.recipientAddress != null and !order.recipientAddress.isBlank()}">
                <strong>주소</strong> : <span th:text="${order.recipientAddress}"></span>
            </div>

            <div th:if="${order.menuDescription != null and !order.menuDescription.isBlank()}"
                 class="menu-box" th:text="${order.menuDescription}"></div>

            <div class="status-row">
                <span th:class="${order.deliveryType == '직접배송'} ? 'type-chip type-direct' : 'type-chip type-parcel'">
                    <span th:if="${order.deliveryType == '직접배송'}">🚗 직접배송</span>
                    <span th:unless="${order.deliveryType == '직접배송'}">📦 택배</span>
                </span>
                <span th:if="${order.paid}" class="badge-paid">✅ 입금완료</span>
                <span th:unless="${order.paid}" class="badge-unpaid">❌ 미입금</span>
                <span th:if="${order.trackingNumber != null and !order.trackingNumber.isBlank()}"
                      class="tracking-chip"
                      th:text="'송장 : ' + ${order.trackingNumber}"></span>
            </div>

            <div class="info-line" th:if="${order.memo != null and !order.memo.isBlank()}"
                 style="margin-top:8px; color:#888;">
                <strong>메모</strong> : <span th:text="${order.memo}"></span>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const year  = /*[[${ym.year}]]*/ 2025;
    const month = /*[[${ym.monthValue}]]*/ 1;
    const today = /*[[${today.dayOfMonth}]]*/ 0;
    const todayYear  = /*[[${today.year}]]*/ 0;
    const todayMonth = /*[[${today.monthValue}]]*/ 0;
    const orderDays         = new Set(/*[[${orderDays}]]*/ []);
    const directDeliveryDays = new Set(/*[[${directDeliveryDays}]]*/ []);

    const grid     = document.getElementById('calGrid');
    const firstDay = new Date(year, month - 1, 1).getDay();
    const lastDay  = new Date(year, month, 0).getDate();
    // 다른 달을 보고 있으면 임박 판정 비활성화
    const todayDay = (year === todayYear && month === todayMonth) ? today : -99;

    // 유효 발송일: 직접배송은 당일, 일요일 택배 → d-2(금), 월요일 택배 → d-3(금), 나머지 → d-1(전날)
    function effectiveActionDay(d) {
        if (directDeliveryDays.has(d)) return d;
        const dow = new Date(year, month - 1, d).getDay(); // 0=일, 1=월
        if (dow === 0) return d - 2;
        if (dow === 1) return d - 3;
        return d - 1;
    }

    // 빈 칸
    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-cell empty';
        grid.appendChild(empty);
    }

    // 날짜 칸
    for (let d = 1; d <= lastDay; d++) {
        const dow      = (firstDay + d - 1) % 7;
        const cell     = document.createElement('div');
        const isToday  = (d === today && year === todayYear && month === todayMonth);
        const hasOrder = orderDays.has(d);
        const ead      = effectiveActionDay(d);
        const daysLeft = ead - todayDay;
        const isSoon   = hasOrder && daysLeft >= 0 && daysLeft <= 2;

        let cls = 'cal-cell';
        if (dow === 0) cls += ' sun';
        if (dow === 6) cls += ' sat';
        if (hasOrder && !isSoon) cls += ' has-order';
        if (isSoon)              cls += ' is-soon';
        if (isToday)             cls += ' is-today';
        cell.className = cls;

        const num = document.createElement('span');
        num.className = 'cal-day-num';
        num.textContent = d;
        cell.appendChild(num);

        if (hasOrder) {
            const dot = document.createElement('span');
            dot.className = 'order-dot';
            dot.textContent = '●';
            cell.appendChild(dot);

            cell.addEventListener('click', () => {
                const target = document.getElementById('day-' + d);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        }

        grid.appendChild(cell);
    }

    // 2일 이내 임박 배송이 있으면 상단 배너 표시
    const hasSoon = [...orderDays].some(d => {
        const diff = effectiveActionDay(d) - todayDay;
        return diff >= 0 && diff <= 2;
    });
    if (hasSoon) {
        document.getElementById('alertBanner').style.display = 'block';
    }
</script>

</body>
</html>
