<!DOCTYPE html>
<html lang="kr" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="common">
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />

    <!-- Jquery Load -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <!-- common.js Load -->

    <script src="js/all.js" crossorigin="anonymous"></script>

    <!-- sweet alert -->

    <!-- Google fonts-->
    <link rel="stylesheet" type="text/css" href="css/fontMontserrat.css" th:href="@{css/fontMontserrat.css}">
    <link rel="stylesheet" type="text/css" href="css/fontRoboto.css" th:href="@{css/fontRoboto.css}">

    <!--<link href="css/styles.css" rel="stylesheet" />-->
