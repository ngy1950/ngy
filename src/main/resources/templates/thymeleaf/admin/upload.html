<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새 사진 등록 | 대원 관리자</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark px-4 py-2" style="background:#5c3d1e;">
    <span class="navbar-brand fw-bold">새 사진 등록</span>
    <a th:href="@{/admin/dashboard}" class="text-white-50 small">← 대시보드</a>
</nav>

<div class="container py-4" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{/admin/gallery/new}" method="post" enctype="multipart/form-data">

                <div class="mb-3">
                    <label class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
                    <input type="text" name="title" class="form-control" required maxlength="200"
                           placeholder="예: 2024년 10월 제사음식 납품">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">카테고리 <span class="text-danger">*</span></label>
                    <select name="category" class="form-select" required>
                        <option value="">선택하세요</option>
                        <option value="jesa">맞춤 제사음식</option>
                        <option value="sije">맞춤 시제상</option>
                        <option value="group">맞춤 단체·행사음식</option>
                        <option value="dosirak">맞춤 도시락</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">행사 날짜</label>
                    <input type="date" name="eventDate" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">설명</label>
                    <textarea name="description" class="form-control" rows="3"
                              placeholder="음식 구성, 수량, 특이사항 등을 자유롭게 적어주세요."></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">사진 업로드 <span class="text-danger">*</span></label>
                    <input type="file" name="images" class="form-control" multiple accept="image/*" required
                           id="imageInput">
                    <div class="form-text">여러 장 선택 가능 (JPG, PNG 권장). 첫 번째 사진이 대표 이미지로 사용됩니다.</div>
                    <!-- 미리보기 -->
                    <div id="preview" class="d-flex flex-wrap gap-2 mt-2"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn text-white fw-bold px-4"
                            style="background:#8b5a2b; border-color:#8b5a2b;">
                        <i class="fas fa-upload me-1"></i> 등록하기
                    </button>
                    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">취소</a>
                </div>

            </form>

        </div>
    </div>
</div>

<script>
    document.getElementById('imageInput').addEventListener('change', function () {
        const preview = document.getElementById('preview');
        preview.innerHTML = '';
        Array.from(this.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.style.cssText = 'width:90px; height:70px; object-fit:cover; border-radius:6px;';
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
