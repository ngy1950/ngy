<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head
    th:replace="~{fragments/head :: headFragment('대원 | 갤러리', '대원의 제사음식·시제상·단체음식 현장 사진과 고객 후기를 확인하세요.', '제사음식 후기, 시제상 사진, 단체음식 갤러리, 청주 케이터링 후기', 'https://daewon.up.railway.app/gallery')}">
</head>

<body>
    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <!-- Subpage Hero -->
    <header class="sub-hero-section"
        style="background-image: linear-gradient(rgba(44,39,36,0.75), rgba(44,39,36,0.75)), url('https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1920&q=80'); background-size: cover; background-position: center;">
        <div class="container text-center text-white">
            <h1 class="animate__animated animate__fadeInDown">갤러리</h1>
            <p class="animate__animated animate__fadeInUp mt-3" style="font-size: 1.2rem;">대원의 정성스러운 음식 모습을 직접 확인하세요</p>
        </div>
    </header>

    <!-- Gallery Section -->
    <section class="section-padding">
        <div class="container">

            <!-- 필터 버튼 -->
            <div class="gallery-filter-wrap mb-4">
                <a th:href="@{/gallery}" th:classappend="${selectedCategory == 'all'} ? 'active' : ''"
                    class="gallery-filter-btn">전체</a>
                <a th:href="@{/gallery(category='jesa')}" th:classappend="${selectedCategory == 'jesa'} ? 'active' : ''"
                    class="gallery-filter-btn">제사음식</a>
                <a th:href="@{/gallery(category='sije')}"
                    th:classappend="${selectedCategory == 'sije'} ? 'active' : ''"
                    class="gallery-filter-btn">시제상</a>
                <a th:href="@{/gallery(category='group')}"
                    th:classappend="${selectedCategory == 'group'} ? 'active' : ''"
                    class="gallery-filter-btn">단체·행사음식</a>
            </div>

            <!-- 게시물 없을 때 -->
            <div th:if="${#lists.isEmpty(posts)}" class="text-center py-5 text-muted">
                <i class="fas fa-images fa-3x mb-3"></i>
                <p>아직 등록된 사진이 없습니다.</p>
            </div>

            <!-- 갤러리 카드 그리드 -->
            <div class="row g-4" th:unless="${#lists.isEmpty(posts)}">
                <div class="col-12 col-sm-6 col-lg-4" th:each="post : ${posts}">
                    <a th:href="@{/gallery/{id}(id=${post.id})}" class="text-decoration-none"
                       data-track-action="gallery_click" th:data-track-label="${post.id}">
                        <div class="gallery-card card h-100 border-0 shadow-sm">
                            <!-- 대표 이미지 -->
                            <div class="gallery-card-img-wrap">
                                <img th:if="${post.thumbnailUrl != null}" th:src="${post.thumbnailUrl}"
                                    th:alt="${post.title}" class="gallery-card-img">
                                <div th:unless="${post.thumbnailUrl != null}"
                                    class="gallery-card-img d-flex align-items-center justify-content-center bg-light text-muted">
                                    <i class="fas fa-image fa-2x"></i>
                                </div>
                                <span class="gallery-category-badge" th:text="${post.categoryLabel}"></span>
                            </div>
                            <div class="card-body">
                                <h5 class="card-title text-dark fw-bold mb-1" th:text="${post.title}"></h5>
                                <p class="card-text text-muted small mb-1"
                                    th:text="${post.eventDate != null} ? ${#temporals.format(post.eventDate, 'yyyy.MM.dd')} : ${#temporals.format(post.createdAt, 'yyyy.MM.dd')}">
                                </p>
                                <!-- 별점 -->
                                <div th:if="${ratingStats[post.id] != null}" class="d-flex align-items-center mb-1">
                                    <span th:each="i : ${#numbers.sequence(1,5)}">
                                        <i th:class="${i <= ratingStats[post.id][0]} ? 'fas fa-star' : 'far fa-star'"
                                            class="text-warning" style="font-size:0.8rem;"></i>
                                    </span>
                                    <small class="ms-1 text-muted">
                                        <span th:text="${#numbers.formatDecimal(ratingStats[post.id][0], 1, 1)}"></span>
                                        (<span th:text="${ratingStats[post.id][1].intValue()}"></span>개)
                                    </small>
                                </div>
                                <p class="card-text text-secondary small text-truncate"
                                    th:if="${post.description != null}" th:text="${post.description}"></p>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

        </div>
    </section>

    <div th:replace="~{fragments/footer :: footerFragment}"></div>

    <style>
        .gallery-card-img-wrap {
            position: relative;
            overflow: hidden;
            height: 220px;
        }

        .gallery-card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-card:hover .gallery-card-img {
            transform: scale(1.05);
        }

        .gallery-category-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(139, 90, 43, 0.85);
            color: white;
            font-size: 0.75rem;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .gallery-filter-btn.active {
            background-color: #8b5a2b;
            border-color: #8b5a2b;
            color: white;
        }
    </style>
</body>

</html>
